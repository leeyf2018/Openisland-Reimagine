name: Sign uploaded release

"on":
  push:
    paths:
      - .github/workflows/sign-uploaded-release.yml
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag whose Open.Island.zip should be signed
        required: true
        default: v1.1.6-reimagine.40

permissions:
  contents: write
  pull-requests: write

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download the published zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || 'v1.1.6-reimagine.40' }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "Open.Island.zip" --output "Open.Island.zip"
          test -s Open.Island.zip

      - name: Sign with Sparkle EdDSA
        id: sparkle_sign
        env:
          SPARKLE_EDDSA_KEY: ${{ secrets.SPARKLE_EDDSA_KEY }}
        run: |
          set -euo pipefail
          python3 -m venv /tmp/sparkle-sign
          /tmp/sparkle-sign/bin/pip install --quiet pynacl
          /tmp/sparkle-sign/bin/python - << 'PY'
          import base64
          import os
          import pathlib
          from nacl.signing import SigningKey

          raw = base64.b64decode("".join(os.environ["SPARKLE_EDDSA_KEY"].split()))
          expected = base64.b64decode("8E+SpYCjW/jEbNqgo+pGJ3sWYw34cvpSisDovbKwZEU=")
          if len(raw) == 64:
              seed = raw[:32]
              suffix = raw[32:]
          elif len(raw) == 32:
              seed = raw
              suffix = None
          else:
              raise SystemExit(f"unexpected key length {len(raw)}")
          signing_key = SigningKey(seed)
          derived = bytes(signing_key.verify_key)
          if derived != expected:
              raise SystemExit("derived public key does not match published SUPublicEDKey")
          if suffix is not None and suffix != expected:
              raise SystemExit("key suffix does not match published public key")
          data = pathlib.Path("Open.Island.zip").read_bytes()
          signature = base64.b64encode(signing_key.sign(data).signature).decode()
          with open(os.environ["GITHUB_OUTPUT"], "a") as handle:
              handle.write(f"ed_signature={signature}\n")
              handle.write(f"length={len(data)}\n")
          print(f"Signed length={len(data)}")
          PY

      - name: Open appcast pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ED_SIGNATURE: ${{ steps.sparkle_sign.outputs.ed_signature }}
          LENGTH: ${{ steps.sparkle_sign.outputs.length }}
        run: |
          set -euo pipefail
          export VERSION="1.1.6-reimagine.40"
          export BUILD="10040"
          export PUB_DATE="$(date -u '+%a, %d %b %Y %H:%M:%S +0000')"
          export DOWNLOAD_URL="https://github.com/leeyf2018/Openisland-Reimagine/releases/download/v${VERSION}/Open.Island.zip"
          cat > /tmp/update_appcast.py << 'ENDSCRIPT'
          import os
          import pathlib
          ed = os.environ["ED_SIGNATURE"]
          length = os.environ["LENGTH"]
          pub = os.environ["PUB_DATE"]
          url = os.environ["DOWNLOAD_URL"]
          version = os.environ["VERSION"]
          build = os.environ["BUILD"]
          path = pathlib.Path("appcast.xml")
          text = path.read_text()
          marker = "<!-- Items are added by the release workflow. See docs/releasing.md. -->"
          if f"<sparkle:version>{build}</sparkle:version>" in text:
              raise SystemExit(f"build {build} already in appcast")
          item = f"""        <item>
              <title>Version {version}</title>
              <sparkle:version>{build}</sparkle:version>
              <sparkle:shortVersionString>{version}</sparkle:shortVersionString>
              <sparkle:minimumSystemVersion>14.0</sparkle:minimumSystemVersion>
              <pubDate>{pub}</pubDate>
              <enclosure
                  url="{url}"
                  type="application/octet-stream"
                  sparkle:edSignature="{ed}"
                  length="{length}"
              />
          </item>"""
          if marker not in text:
              raise SystemExit("appcast marker missing")
          path.write_text(text.replace(marker, marker + "\n" + item, 1))
          ENDSCRIPT
          python3 /tmp/update_appcast.py
          branch="chore/appcast-v1.1.6-reimagine.40"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add appcast.xml
          git commit -m "chore: update appcast.xml for v1.1.6-reimagine.40"
          git push --force origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore: update appcast.xml for v1.1.6-reimagine.40" \
            --body "Signed enclosure for the already published reimagine.40 zip."
          gh pr merge "$branch" --merge --admin --delete-branch
