name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  pull-requests: write

jobs:
  build-and-release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Load canonical release identity
        id: version
        run: |
          source config/release.env
          if [[ "$GITHUB_REF_NAME" != "v$REIMAGINE_VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME must equal v$REIMAGINE_VERSION from config/release.env"
            exit 1
          fi
          echo "version=$REIMAGINE_VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$REIMAGINE_BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "bundle_id=$REIMAGINE_BUNDLE_ID" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          brew install create-dmg
          pip3 install --break-system-packages Pillow

      # Reimagine uses a stable self-signed identity by default. This keeps the
      # app's TCC identity stable without an Apple Developer Program account.
      # Apple Developer ID remains an optional future upgrade.
      - name: Import signing certificate
        id: signing
        env:
          CERTIFICATE_P12: ${{ secrets.REIMAGINE_CERTIFICATE_P12 || secrets.APPLE_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.REIMAGINE_CERTIFICATE_PASSWORD || secrets.APPLE_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.REIMAGINE_SIGNING_IDENTITY || secrets.APPLE_SIGNING_IDENTITY }}
          SIGNING_MODE: ${{ vars.REIMAGINE_SIGNING_MODE }}
          SKIP_NOTARIZE: ${{ vars.SKIP_NOTARIZE }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          echo "keychain_path=$KEYCHAIN_PATH" >> "$GITHUB_OUTPUT"

          if [[ -z "${CERTIFICATE_P12:-}" ]]; then
            echo "::warning::No signing certificate is configured — packaging with an ad-hoc signature."
            echo "has_identity=false" >> "$GITHUB_OUTPUT"
            echo "notary_ready=false" >> "$GITHUB_OUTPUT"
            echo "mode=adhoc" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          : "${CERTIFICATE_PASSWORD:?Certificate password is required}"
          : "${SIGNING_IDENTITY:?Signing identity is required}"
          SIGNING_MODE="${SIGNING_MODE:-developer-id}"
          [[ "$SIGNING_MODE" == "self-signed" || "$SIGNING_MODE" == "developer-id" ]] || {
            echo "::error::REIMAGINE_SIGNING_MODE must be self-signed or developer-id"
            exit 1
          }

          # Decode the p12 certificate from base64
          CERT_FILE="$(mktemp).p12"
          echo "$CERTIFICATE_P12" | base64 --decode > "$CERT_FILE"

          # Create a temporary keychain
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import the certificate (.p12 = identity = cert + private key)
          security import "$CERT_FILE" \
            -P "$CERTIFICATE_PASSWORD" \
            -A \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          RESOLVED_IDENTITY="$(security find-certificate -c "$SIGNING_IDENTITY" -Z "$KEYCHAIN_PATH" \
            | awk '/SHA-1 hash:/{print $3; exit}')"
          if [[ -z "$RESOLVED_IDENTITY" ]]; then
            echo "::error::Imported certificate does not match SIGNING_IDENTITY: $SIGNING_IDENTITY"
            exit 1
          fi
          echo "resolved_identity=$RESOLVED_IDENTITY" >> "$GITHUB_OUTPUT"

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          # Add the keychain to the search list
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          # Self-signed certificates cannot use Apple's notarization service.
          # Credential validation failures must stop the workflow before any
          # release assets or update metadata are published.
          if [[ "$SIGNING_MODE" == "self-signed" ]]; then
            echo "Self-signed identity imported; Apple notarization is not applicable."
            echo "notary_ready=false" >> "$GITHUB_OUTPUT"
          elif [[ "${SKIP_NOTARIZE:-}" == "true" ]]; then
            echo "Skipping notarytool credential setup because SKIP_NOTARIZE is true."
            echo "notary_ready=false" >> "$GITHUB_OUTPUT"
          else
            xcrun notarytool store-credentials "open-island-notary" \
              --apple-id "${{ secrets.APPLE_ID }}" \
              --team-id "${{ secrets.APPLE_TEAM_ID }}" \
              --password "${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}" \
              --keychain "$KEYCHAIN_PATH"
            echo "notary_ready=true" >> "$GITHUB_OUTPUT"
          fi

          echo "has_identity=true" >> "$GITHUB_OUTPUT"
          echo "mode=$SIGNING_MODE" >> "$GITHUB_OUTPUT"
          # Clean up
          rm -f "$CERT_FILE"

      - name: Build and package
        env:
          OPEN_ISLAND_APP_NAME: "Open Island"
          OPEN_ISLAND_BUNDLE_ID: ${{ steps.version.outputs.bundle_id }}
          OPEN_ISLAND_VERSION: ${{ steps.version.outputs.version }}
          OPEN_ISLAND_BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
          OPEN_ISLAND_SIGN_IDENTITY: ${{ steps.signing.outputs.resolved_identity }}
          OPEN_ISLAND_SIGNING_MODE: ${{ steps.signing.outputs.mode }}
          OPEN_ISLAND_CODE_SIGN_TIMESTAMP: ${{ steps.signing.outputs.mode == 'self-signed' && 'false' || 'true' }}
          OPEN_ISLAND_UNIVERSAL: "true"
        run: |
          if [[ "${{ steps.signing.outputs.has_identity }}" != "true" ]]; then
            unset OPEN_ISLAND_SIGN_IDENTITY || true
            export OPEN_ISLAND_SIGN_IDENTITY=""
            echo "Packaging without a stable signing identity."
          fi
          zsh scripts/package-app.sh

      - name: Verify artifacts
        run: |
          source config/release.env
          test -f "output/package/Open Island.zip"
          # DMG may be optional if create-dmg path differs; require zip always
          if [[ -f "output/package/Open Island.dmg" ]]; then
            ls -lh "output/package/Open Island.dmg"
          else
            echo "::warning::Open Island.dmg not produced; zip-only release is allowed for ad-hoc builds."
          fi
          ls -lh output/package/

          plist="output/package/Open Island.app/Contents/Info.plist"
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")" == "$REIMAGINE_BUNDLE_ID" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")" == "$REIMAGINE_VERSION" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")" == "$REIMAGINE_BUILD_NUMBER" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :SUFeedURL' "$plist")" == "$REIMAGINE_FEED_URL" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' "$plist")" == "$REIMAGINE_EDDSA_PUBLIC_KEY" ]]

      - name: Verify code signature
        run: |
          bundle="output/package/Open Island.app"
          echo "--- Signature info ---"
          codesign -dvv "$bundle" || true
          echo ""
          echo "--- Signature verification ---"
          if [[ "${{ steps.signing.outputs.has_identity }}" == "true" ]]; then
            codesign --verify --deep --strict --verbose=2 "$bundle"
          else
            # Ad-hoc: deep strict may still pass; do not fail the release on Gatekeeper path
            codesign --verify --verbose=2 "$bundle" || true
            echo "Ad-hoc / non-Developer-ID build — Gatekeeper may require right-click Open."
          fi

      - name: Verify bundle structure
        run: |
          bundle="output/package/Open Island.app"
          echo "--- Bundle contents ---"
          find "$bundle" -maxdepth 3 -type f | sort

          # Required files
          for f in \
            "Contents/MacOS/OpenIslandApp" \
            "Contents/Helpers/OpenIslandHooks" \
            "Contents/Helpers/OpenIslandSetup" \
            "Contents/Resources/OpenIsland.icns" \
            "Contents/Resources/OpenIsland_OpenIslandApp.bundle" \
          ; do
            if [[ ! -e "$bundle/$f" ]]; then
              echo "::error::Missing required file: $f"
              exit 1
            fi
          done

          echo "Bundle structure OK"

      - name: Notarize
        if: vars.SKIP_NOTARIZE != 'true' && steps.signing.outputs.notary_ready == 'true'
        id: notarize
        env:
          OPEN_ISLAND_APP_NAME: "Open Island"
        run: |
          bundle="output/package/$OPEN_ISLAND_APP_NAME.app"
          zip_path="output/package/$OPEN_ISLAND_APP_NAME.zip"
          dmg_path="output/package/$OPEN_ISLAND_APP_NAME.dmg"

          echo "Submitting for notarization..."
          xcrun notarytool submit "$zip_path" \
            --keychain-profile "open-island-notary" \
            --wait --timeout 10m

          echo "Stapling app bundle..."
          xcrun stapler staple -v "$bundle"

          # Re-create zip with stapled bundle
          rm -f "$zip_path"
          ditto -c -k --keepParent "$bundle" "$zip_path"

          # Re-sign and notarize DMG
          codesign --force --sign "${{ steps.signing.outputs.resolved_identity }}" --timestamp "$dmg_path"
          xcrun notarytool submit "$dmg_path" \
            --keychain-profile "open-island-notary" \
            --wait --timeout 10m
          xcrun stapler staple -v "$dmg_path"

          echo "notarized=true" >> "$GITHUB_OUTPUT"

      - name: Sign update with EdDSA (Sparkle)
        id: sparkle_sign
        env:
          SPARKLE_EDDSA_KEY: ${{ secrets.SPARKLE_EDDSA_KEY }}
        run: |
          sign_tool=".build/artifacts/sparkle/Sparkle/bin/sign_update"
          zip_path="output/package/Open Island.zip"

          : "${SPARKLE_EDDSA_KEY:?SPARKLE_EDDSA_KEY is required for every Reimagine release}"

          # sign_update reads the private EdDSA key from stdin via --ed-key-file -
          sign_output="$(echo "$SPARKLE_EDDSA_KEY" | "$sign_tool" "$zip_path" --ed-key-file -)"
          ed_signature="$(echo "$sign_output" | sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p')"
          length="$(echo "$sign_output" | sed -n 's/.*length="\([^"]*\)".*/\1/p')"

          [[ -n "$ed_signature" ]] || { echo "::error::Sparkle signature was empty"; exit 1; }
          [[ "$length" =~ ^[0-9]+$ ]] || { echo "::error::Sparkle archive length was invalid"; exit 1; }

          echo "ed_signature=$ed_signature" >> "$GITHUB_OUTPUT"
          echo "length=$length" >> "$GITHUB_OUTPUT"
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "EdDSA signature: $ed_signature (length: $length)"

      - name: Create published GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          assets=("output/package/Open Island.zip#Open Island.zip (macOS)")
          if [[ -f "output/package/Open Island.dmg" ]]; then
            assets+=("output/package/Open Island.dmg#Open Island.dmg (macOS)")
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::warning::Release $GITHUB_REF_NAME already exists — refreshing assets only."
            for a in "${assets[@]}"; do
              gh release upload "$GITHUB_REF_NAME" "${a%%#*}" --clobber
            done
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "Open Island $GITHUB_REF_NAME" \
              --generate-notes \
              "${assets[@]}"
          fi

      - name: Update appcast.xml
        if: steps.sparkle_sign.outputs.signed == 'true'
        run: |
          zsh scripts/update-appcast.sh \
            "${{ steps.version.outputs.version }}" \
            "${{ steps.version.outputs.build_number }}" \
            "${{ steps.sparkle_sign.outputs.ed_signature }}" \
            "${{ steps.sparkle_sign.outputs.length }}"
          cat appcast.xml

      - name: Update appcast.xml via PR
        if: steps.sparkle_sign.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="chore/appcast-v${{ steps.version.outputs.version }}"
          # Save the updated appcast.xml before switching branches
          cp appcast.xml /tmp/appcast.xml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -f -b "$branch" origin/main
          cp /tmp/appcast.xml appcast.xml
          git add appcast.xml
          git commit -m "chore: update appcast.xml for v${{ steps.version.outputs.version }}"
          git push --force origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore: update appcast.xml for v${{ steps.version.outputs.version }}" \
            --body "Automated appcast.xml update from release workflow."
          gh pr merge "$branch" --merge --admin --delete-branch

      - name: Append install instructions to release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTARIZED: ${{ steps.notarize.outputs.notarized }}
          HAS_IDENTITY: ${{ steps.signing.outputs.has_identity }}
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
        run: |
          existing="$(gh release view "$GITHUB_REF_NAME" --json body -q .body)"
          if [[ "$NOTARIZED" == "true" ]]; then
            install_note="> This build is signed and notarized by Apple. It will launch without Gatekeeper warnings."
          elif [[ "$SIGNING_MODE" == "self-signed" ]]; then
            install_note="> This build uses Reimagine's stable self-signed identity (not Apple notarized). On first launch, right-click → **Open**. Accessibility permission then remains attached to the same app identity across Reimagine updates."
          elif [[ "$HAS_IDENTITY" == "true" ]]; then
            install_note="> This build is signed with a Developer ID certificate. On first launch, right-click → **Open** to bypass Gatekeeper."
          else
            install_note="> This build is ad-hoc signed (no Apple Developer ID in CI). First open: right-click → **Open**."
          fi
          gh release edit "$GITHUB_REF_NAME" --notes "$(cat <<EOF
          ${existing}

          ---

          ## Installation

          1. Download **Open Island.zip** (or **.dmg** if present), open it, and drag **Open Island** to **Applications**.
          2. Requires **macOS 14+** (Apple Silicon; universal when CI builds with OPEN_ISLAND_UNIVERSAL).

          ${install_note}
          EOF
          )"

      - name: Cleanup keychain
        if: always()
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
